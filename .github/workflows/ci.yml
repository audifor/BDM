name: BDM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Determinism boundary
        shell: bash
        run: |
          if grep -R --line-number --include='*.ts' --include='*.tsx' 'Math\.random(' src; then
            echo 'Math.random() is forbidden in src/'
            exit 1
          fi

      - name: Domain and Engine dependency boundaries
        shell: bash
        run: |
          if grep -R -E --line-number --include='*.ts' --include='*.tsx' "from ['\"](react|zustand|@tauri-apps/)" src/domain src/engine; then
            echo 'React, Zustand or Tauri import found in Domain/Engine'
            exit 1
          fi

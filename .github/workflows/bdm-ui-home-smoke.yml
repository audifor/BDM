name: BDM UI Home smoke

on:
  push:
    branches:
      - feat/bdm-ui-home-redesign

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- src/ui-ng/applications/home/homeLeaderCategories.test.ts src/ui-ng/applications/home/homeStandingsDigest.test.ts src/ui-ng/applications/home/HomeWorkspace.test.tsx

name: BS19C Staff Request Repair

on:
  push:
    branches:
      - feat/bs19c-staff-request-repair-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: BDM typecheck
        run: npm run typecheck
      - name: Real staff request follow-up and autonomy regression
        run: npm test -- src/app/coachLife/StaffRequestFollowUp.test.ts src/app/staffCareerAutonomy/StaffCareerAutonomyService.test.ts
      - name: Existing BS19 life/relationship and Person50
        run: npm test -- src/app/coachLife/CoachLifeDecision.test.ts src/app/game/UserCoachCreator.test.ts src/domain/personality/ObservedPersonalityEvolution.test.ts
      - name: WorldDB staff relationship and Save V4
        run: npm test -- src/app/game/WorldDbGameBootstrap.test.ts -t 'BS19B|BS19C'

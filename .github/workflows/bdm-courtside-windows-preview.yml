name: BDM Courtside Windows Preview
on:
  push:
    branches: [feat/bdm-ui-courtside]
  workflow_dispatch:

# The preview must always follow the latest Courtside commit. A partial
# paths filter made Finance changes invisible in the downloadable EXE.
concurrency:
  group: bdm-courtside-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    name: Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout the isolated Courtside branch
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Compile isolated desktop preview without installer
        run: npm run tauri build -- --no-bundle --config src-tauri/tauri.courtside-preview.conf.json
      - name: Prepare preview and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path preview -Force | Out-Null
          Copy-Item "src-tauri/target/release/bdm.exe" "preview/BDM-Courtside-Preview.exe"
          @'
          BDM COURTSIDE PREVIEW
          ---------------------
          1. Extract this ZIP to a NEW folder, not over an earlier preview.
          2. Double-click BDM-Courtside-Preview.exe (Windows 10/11).
          3. Create a NEW test save.
          4. Open Inicio > Gestion del club > Finances.
          5. Verify five primary tabs: Resumen, Caja, Presupuesto, Plantilla, Futuro.
          6. In Resumen, look for "Tu dinero, de un vistazo".
          7. In Presupuesto, review spending vs plan. Test light and dark themes.
          8. Also verify Medical, Training, Tactics and the other Courtside apps.
          Do not use primary saves for testing.
          This is an unsigned development preview, not a production release.
          Old downloaded EXE files do not automatically update.
          Verify the exact commit in BUILD-INFO.txt against this GitHub Actions run.
          '@ | Set-Content -Path "preview/README-PREVIEW.txt" -Encoding utf8
          @"
          BDM COURTSIDE
          GitHub commit: ${{ github.sha }}
          GitHub run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Source branch: ${{ github.ref_name }}
          Frontend modules: Finance, Board, Club, Medical, Training, Staff, Coach, Roster
          "@ | Set-Content -Path "preview/BUILD-INFO.txt" -Encoding utf8
      - name: Upload downloadable Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: BDM-Courtside-Windows-Preview
          path: preview/*
          retention-days: 14
          if-no-files-found: error

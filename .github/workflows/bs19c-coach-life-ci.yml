name: BS19C Coach Life CI

on:
  push:
    branches:
      - feat/bs19c-debt-life-choice-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coach-life:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: BS19B creator + BS19C life decision + startup
        run: npm test -- src/app/coachLife/CoachLifeDecision.test.ts src/app/game/UserCoachCreator.test.ts src/ui/startup/BootstrapApp.test.tsx
      - name: WorldDB P0 and Save compatibility
        run: npm test -- src/app/game/WorldDbGameBootstrap.test.ts -t BS19B

name: BS19C P6 Political Lobbying

on:
  push:
    branches:
      - feat/bs19c-political-lobby-p6-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  political-lobby:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: BDM TypeScript
        run: npm run typecheck
      - name: P6 NPC lobbying and canonical political engine
        run: npm test -- --testTimeout=30000 --maxWorkers=2 src/app/coachLife/StaffPoliticalLobby.test.ts src/engine/staff/StaffPoliticalCaseEngine.test.ts src/engine/staff/StaffPoliticalActionEngine.test.ts src/engine/staff/StaffPoliticalActionConsequenceEngine.test.ts src/engine/staff/StaffPoliticalGroupEngine.test.ts
      - name: P5/P4 and PERSON50 regression
        run: npm test -- src/app/coachLife/StaffProfessionalCommitment.test.ts src/app/coachLife/StaffRequestFollowUp.test.ts src/domain/personality/ObservedPersonalityEvolution.test.ts
      - name: Coach creation and WorldDB
        run: npm test -- src/app/game/UserCoachCreator.test.ts src/app/game/WorldDbGameBootstrap.test.ts -t 'BS19B|BS19C|created Coach'

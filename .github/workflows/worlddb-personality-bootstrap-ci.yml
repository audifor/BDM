name: WorldDB PERSON Personality Bootstrap CI

on:
  push:
    branches:
      - feat/worlddb-personality-runtime-bootstrap-v1

permissions:
  contents: read

jobs:
  personality-ts:
    name: WorldDB PERSON TypeScript
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused WorldDB and relationship tests
        run: |
          npm test -- src/domain/personality/SemanticPersonalityEffects.test.ts src/domain/world/CompatibilityInteractionBridge.test.ts
          npx vitest run src/app/game/WorldDbGameBootstrap.test.ts -t 'WorldDB canonical PERSON personality bootstrapping|WorldDB full 50-dimension PERSON runtime and Save V4'

  personality-native:
    name: WorldDB PERSON native Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Native tests and compile
        run: cargo test --manifest-path src-tauri/Cargo.toml world_db_bootstrap::tests --lib

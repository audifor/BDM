name: WorldDB NBA focused
on:
  push:
    branches:
      - feature/worlddb-nba-01
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Python NBA WorldDB generator tests
        run: python -m unittest discover -s scripts/playable -p 'test_worlddb_v2_simulation_fallback.py' -v
      - name: Typecheck
        run: npm run typecheck
      - name: Franchise identity and NBA full season
        run: npx vitest run src/app/game/NbaConferenceSource.test.ts src/app/game/WorldDbGlobalFamilies.test.ts --maxWorkers=1 --testTimeout=600000

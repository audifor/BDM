name: WorldDB generated matrix focused
on:
  push:
    branches:
      - feature/worlddb-matrix-scheduler-01
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Python NBL and format generator tests
        run: python -m unittest discover -s scripts/playable -p 'test_worlddb_v2_simulation_fallback.py' -v
      - name: Typecheck
        run: npm run typecheck
      - name: Matrix quotas and GameWorld lifecycle
        run: npx vitest run src/engine/competition/schedule/MatrixScheduleGenerator.test.ts src/app/game/WorldDbGlobalFamilies.test.ts --maxWorkers=1 --testTimeout=180000

name: WorldDB NCAA men-women March Madness 2027
on:
  push:
    branches:
      - feature/worlddb-ncaa-postseason-2027-01
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Conference and national tournament lifecycle 2027, male and female
        run: npx vitest run src/app/game/NcaaD1Real2027Postseason.test.ts --maxWorkers=1 --testTimeout=600000

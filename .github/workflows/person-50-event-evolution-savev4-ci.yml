name: PERSON 50 Event Evolution Save V4 CI
on:
  push:
    branches:
      - feat/person-50-observed-evolution-savev4
permissions:
  contents: read
jobs:
  personality:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused PERSON evolution Save V4 tests
        run: |
          npx vitest run src/domain/world/ObservedPersonalitySaveV4.test.ts src/domain/personality/SemanticPersonalityEffects.test.ts src/domain/world/SemanticRelationshipAutoBridge.test.ts src/save/MoralePersistence.test.ts

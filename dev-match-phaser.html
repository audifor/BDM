<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basketball Truth · BT1</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const params = new URLSearchParams(location.search)
      const num = (key) => (params.get(key) !== null && Number.isFinite(Number(params.get(key))) ? Number(params.get(key)) : undefined)
      const seed = num('seed')
      const speed = num('speed')
      const camera = params.get('camera') ?? undefined
      const truth = params.get('truth') === '1'
      const { mountMatchPhaserDemo } = await import('/src/presentation/match-phaser/dev/mountMatchPhaserDemo.ts')
      const handle = mountMatchPhaserDemo(document.getElementById('root'), {
        ...(seed !== undefined ? { seed } : {}),
        ...(speed !== undefined ? { speed } : {}),
        ...(camera !== undefined ? { camera } : {}),
        ...(truth ? { truth: true } : {}),
      })
      window.__bdmMatchPhaserDemo = handle
    </script>
  </body>
</html>
